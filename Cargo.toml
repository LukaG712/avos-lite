[workspace]
resolver = "2"
members = [
  "crates/avos-cli",
  "crates/avos-daemon",
  "crates/avos-license",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/LukaG712/avos-lite"

[workspace.dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
